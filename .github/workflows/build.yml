name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CleanFrame UI and adapt it for Android TV
        run: |
          git clone --depth 1 https://github.com/nthnclrk/CleanFrame.git /tmp/cf
          mkdir -p app/src/main/assets/app
          cp -r /tmp/cf/app/. app/src/main/assets/app/
          cp /tmp/cf/LICENSE /tmp/cf/THIRD_PARTY_NOTICES.md app/src/main/assets/
          test -f app/src/main/assets/app/device.js
          cp shim/device.js app/src/main/assets/app/device.js
          bash shim/patch-ui.sh app/src/main/assets/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app/build/outputs/apk/debug/app-debug.apk
